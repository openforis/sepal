---
- name: Mount EFS Sepal Home Dir
  mount:
    name: "/data/sepal/home"
    fstype: "efs"
    state: "mounted"
    src: "{{ lookup('env', 'AWS_EFS_ID') }}:/data/sepal/home"
    opts: "defaults,_netdev"
    dump: 0
    passno: 0

- name: Mount EFS Worker Instance Logs
  mount:
    name: "/var/log/sepal/worker"
    fstype: "efs"
    state: "mounted"
    src: "{{ lookup('env', 'AWS_EFS_ID') }}:/data/sepal/worker-instance-log"
    opts: "defaults,_netdev"
    dump: 0
    passno: 0

# Per-user task and sandbox logs live on EFS, like the worker logs before them. EFS only mounts a directory that
# exists, so it is created through the worker log mount first.
- name: Create EFS user log directory
  file:
    path: "/var/log/sepal/worker/user-log"
    state: directory
    mode: '0755'

- name: Mount EFS user logs
  mount:
    name: "/var/log/sepal/user"
    fstype: "efs"
    state: "mounted"
    src: "{{ lookup('env', 'AWS_EFS_ID') }}:/data/sepal/worker-instance-log/user-log"
    opts: "defaults,_netdev"
    dump: 0
    passno: 0

# Exports to Data stage here, outside the homes, where sandboxes never see it. EFS only mounts a directory that
# exists, and no other mount holds this one, so the first deploy creates it through a temporary mount of the
# file system's root.
- name: Create EFS task staging directory
  shell: |
    mountpoint -q /data/sepal/task-staging && exit 0
    set -e
    root=$(mktemp -d)
    trap 'umount "$root" 2>/dev/null; rmdir "$root"' EXIT
    mount -t efs {{ lookup('env', 'AWS_EFS_ID') }}:/ "$root"
    mkdir -p "$root/data/sepal/task-staging"
    echo created
  register: task_staging_directory
  changed_when: task_staging_directory.stdout == 'created'

- name: Mount EFS task staging
  mount:
    name: "/data/sepal/task-staging"
    fstype: "efs"
    state: "mounted"
    src: "{{ lookup('env', 'AWS_EFS_ID') }}:/data/sepal/task-staging"
    opts: "defaults,_netdev"
    dump: 0
    passno: 0

# task-manager, as root, creates each task's folder; the task's container hands it to the user.
- name: Restrict EFS task staging
  file:
    path: "/data/sepal/task-staging"
    state: directory
    owner: root
    group: root
    mode: '0711'

- name: Mount /data/sepal/jupyter
  mount:
    name: "/data/sepal/jupyter"
    fstype: "lustre"
    state: "mounted"
    src: "{{ lookup('env', 'AWS_FSX_ID') }}/data/sepal/jupyter"
    opts: "noatime,flock"
    dump: 0
    passno: 0

- name: Mount /data/sepal/shared
  mount:
    name: "/data/sepal/shared"
    fstype: "lustre"
    state: "mounted"
    src: "{{ lookup('env', 'AWS_FSX_ID') }}/data/sepal/shared"
    opts: "noatime,flock"
    dump: 0
    passno: 0

- name: Mount /data/sepal/shiny
  mount:
    name: "/data/sepal/shiny"
    fstype: "lustre"
    state: "mounted"
    src: "{{ lookup('env', 'AWS_FSX_ID') }}/data/sepal/shiny"
    opts: "noatime,flock"
    dump: 0
    passno: 0

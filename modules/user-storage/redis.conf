# Redis configuration for user-storage-redis.
#
# Holds per-user storage accounting and session flags. Evicting a key yields
# wrong quotas with no indication anything was lost.
#
# maxmemory is a guard rail, not a cache budget: with noeviction, reaching it
# makes writes fail loudly rather than silently discarding keys.
maxmemory 512mb
maxmemory-policy noeviction

# Redis configuration for r-proxy-redis.
#
# Holds the BullMQ CRAN build queue -- roughly one job per CRAN package, so a
# full sync is ~23k keys and ~25MB, and each new OS/kernel generation adds its
# own queue namespace.
#
# Deliberately uncapped: this runs on the operations host, which has no monit,
# so a cap here could stall a sandbox image build with nothing to alert on.
maxmemory-policy noeviction

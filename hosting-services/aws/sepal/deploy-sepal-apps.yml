- name: Configure Sepal-Apps instance
  hosts: all
  user: ec2-user
  become: yes
  gather_facts: true
  gather_subset:
    - '!all'

  pre_tasks:
    # bash prompt
    - name: Set bash prompt
      blockinfile:
        path: /etc/profile
        block: |
          # Bash prompt
          PS1='{{ lookup('env', 'BASH_PROMPT_APPS') }}'

    # set locale
    - name: Set locale
      lineinfile:
        path: /etc/environment
        line: "{{ item }}"
      with_items:
        - "LANG=en_US.utf-8"
        - "LC_ALL=en_US.utf-8"

    # monit comes from EPEL on Amazon Linux 2 and from SPAL on Amazon Linux 2023
    - name: Install epel
      command: "amazon-linux-extras install epel -y"
      args:
        creates: /etc/yum.repos.d/epel.repo
      when: ansible_distribution_major_version == '2'

    - name: Install spal-release
      dnf:
        name: spal-release
      when: ansible_distribution_major_version != '2'

    # One transaction: each yum task reloads the repository metadata. Amazon Linux 2023 packages the Docker SDK.
    - name: Install packages
      yum:
        name: "{{ ['monit', 'rsyslog'] + (['python3-docker'] if ansible_distribution_major_version != '2' else []) }}"

    - name: Stop monit
      systemd:
        name: monit
        state: stopped
        enabled: yes
        masked: no

    - name: Configure monit/1
      copy:
        src: "monit/sepal-apps/monit.d/"
        dest: "/etc/monit.d/"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: Configure monit/2
      template:
        src: "monit/config.template"
        dest: "/etc/monit.d/config"
        owner: "root"
        group: "root"
        mode: "0600"

    - name: Configure monit/3
      copy:
        src: "monit/sepal-apps/check/"
        dest: "/usr/local/bin/"
        owner: "root"
        group: "root"
        mode: "0755"

    - name: Configure monit/4
      template:
        src: "monit/pushover-notify.template"
        dest: "/usr/local/bin/pushover-notify"
        owner: "root"
        group: "root"
        mode: "0700"
      vars:
        monit_instance: "SEPAL-apps"

    - name: Remove unused aws.properties
      file:
        path: "/data/sepal/etc/aws.properties"
        state: absent

    # rsyslog
    - name: Copy rsyslog.conf
      template: src="rsyslog.conf" dest=/etc/rsyslog.conf
      register: rsyslog_conf

    - name: Start rsyslog
      service:
        name: rsyslog
        state: "{{ 'restarted' if rsyslog_conf.changed else 'started' }}"
        enabled: yes

    # docker
    - name: Create filesystem on Docker volume
      filesystem:
        fstype: xfs
        dev: /dev/sdb

    - name: Mount Docker volume
      mount:
        path: /var/lib/docker
        src: /dev/sdb
        fstype: xfs
        state: mounted

    - name: Create docker-registry certificate dir
      file:
        path: "/etc/docker/certs.d/{{ lookup('env', 'DOCKER_REGISTRY_HOST') }}"
        state: directory

    - name: Copy docker-registry certificate
      copy:
        src: "{{ config_home }}/certificates/docker-registry.crt"
        dest: "/etc/docker/certs.d/{{ lookup('env', 'DOCKER_REGISTRY_HOST') }}/ca.crt"

    - name: Enable the Docker extras topic
      command: "amazon-linux-extras enable docker"
      changed_when: false
      when: ansible_distribution_major_version == '2'

    # Only a DOCKER_VERSION change upgrades Docker (see deploy.sh)
    - name: Install docker
      yum:
        name: "docker{{ '-' ~ lookup('env', 'DOCKER_VERSION') if lookup('env', 'DOCKER_VERSION') else '' }}"

    - name: Create /etc/docker
      file:
        path: "/etc/docker"
        state: directory

    - name: Copy /etc/docker/daemon.json
      template: src=docker/apps-daemon.json dest=/etc/docker/daemon.json
        
    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker

    - name: Enable docker
      systemd:
        name: docker
        state: started
        enabled: yes
        masked: no

    - name: pip install urllib3 and requests
      pip:
        name:
          - urllib3==1.26.18
          - requests
        executable: pip3
      when: ansible_distribution_major_version == '2'

    # Hosts deployed before joining the swarm have a local sepal bridge, which would shadow the swarm network. Its
    # containers go with it: run-module recreates the modules, and app-launcher its apps on sepal-apps.
    - name: Get the sepal network
      community.docker.docker_network_info:
        name: sepal
      register: sepal_network

    - name: Remove the local sepal network and its containers
      when: sepal_network.exists and sepal_network.network.Scope == 'local'
      block:
        - name: Remove containers on the local sepal network
          command: "docker rm -f {{ sepal_network.network.Containers.keys() | join(' ') }}"
          when: sepal_network.network.Containers

        - name: Remove the local sepal network
          docker_network:
            name: sepal
            state: absent

    - ec2_instance_info:
        region: "{{ lookup('env', 'AWS_REGION') }}"
        filters:
          tag:Type: "Sepal"
          tag:Environment: "{{ lookup('env', 'DEPLOY_ENVIRONMENT') }}"
          instance-state-name: running
      delegate_to: localhost
      register: ec2_sepal

    - name: Join the swarm as a worker
      docker_swarm:
        state: join
        join_token: "{{ swarm_token }}"
        remote_addrs: ["{{ ec2_sepal.instances[0].private_ip_address }}:2377"]

    # A fixed subnet: Docker picks free ones from the networks it knows, which may not yet include the swarm's sepal
    - name: Create the sepal-apps network
      docker_network:
        name: sepal-apps
        ipam_config:
          - subnet: 172.30.0.0/16

    - file:
        path: "/usr/local/lib/docker/cli-plugins"
        state: directory

    - uri:
        url: https://github.com/docker/compose/releases/download/v{{ lookup('env', 'DOCKER_COMPOSE_VERSION') }}/docker-compose-linux-x86_64
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: +x
        status_code: [200, 304]

    - uri:
        url: https://github.com/docker/buildx/releases/download/v{{ lookup('env', 'DOCKER_BUILDX_VERSION') }}/buildx-v{{ lookup('env', 'DOCKER_BUILDX_VERSION') }}.linux-amd64
        dest: /usr/libexec/docker/cli-plugins/docker-buildx
        mode: +x
        status_code: [200, 304]

    # The env file holds the deployment's credentials: root only
    - file: path="/etc/sepal/env.d" state=directory mode=0700
    - name: Copy env file to env-config
      copy:
        src: "{{ env_file }}"
        dest: "/etc/sepal/env.d/env-config"
        mode: "0600"

    - name: Creating env-current file
      copy:
        dest: "/etc/sepal/env.d/env-current"
        content: |
          SEPAL_VERSION={{ version }}
          SYSLOG_ADDRESS={{ syslog_address }}

    - name: Assemble a single env file
      ansible.builtin.assemble:
        src: /etc/sepal/env.d
        dest: /etc/sepal/env
        mode: "0600"

    - name: Copy logger docker compose file
      copy:
        src: "{{ lookup('env', 'PROJECT_DIR') }}/modules/docker-compose.logger.yml"
        dest: "/var/lib/sepal/modules/"

  post_tasks:
    - name: Start monit
      systemd:
        name: monit
        state: started
        enabled: yes
        masked: no

  roles:
    - { role: live-patching }
    - { role: btop }
    - { role: docker-login }
    - { role: run-module, module: app-launcher }

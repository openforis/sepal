# Per-user logs in /var/log/sepal/user/<username>/<kind>.log, each line tagged by the task or sandbox it came from.
# Task and sandbox containers are tagged "<kind>/<username>/<id>"; Docker's syslog driver appends "[<pid>]:".

template(name="UserLogFileName" type="list") {
    constant(value="/var/log/sepal/user/")
    property(name="syslogtag" securepath="replace" regex.expression="^[a-z]*/\\([^/]*\\)/" regex.submatch="1")
    constant(value="/")
    property(name="syslogtag" securepath="replace" regex.expression="^\\([a-z]*\\)/" regex.submatch="1")
    constant(value=".log")
}

template(name="UserLogLine" type="list") {
    property(name="timestamp" dateFormat="rfc3339")
    constant(value=" ")
    property(name="syslogtag" regex.expression="^[a-z]*/[^/]*/\\([^]:[]*\\)" regex.submatch="1")
    constant(value=":")
    property(name="msg")
    constant(value="\n")
}

if $syslogtag startswith "task/" or $syslogtag startswith "sandbox/" then {
    action(type="omfile" dynafile="UserLogFileName" template="UserLogLine" dirCreateMode="0755" fileCreateMode="0640")
    stop
}

# Sandboxes created before their containers were tagged "sandbox/<username>/<instance name>" are still tagged
# "worker-docker/sandbox.<username>.<instance name>.<instance id>" until their session ends.

template(name="LegacySandboxLogFileName" type="list") {
    constant(value="/var/log/sepal/user/")
    property(name="syslogtag" securepath="replace" regex.expression="^worker-docker/sandbox\\.\\([^.]*\\)\\." regex.submatch="1")
    constant(value="/sandbox.log")
}

template(name="LegacySandboxLogLine" type="list") {
    property(name="timestamp" dateFormat="rfc3339")
    constant(value=" ")
    property(name="syslogtag" regex.expression="^worker-docker/sandbox\\.[^.]*\\.\\([^.]*\\)\\." regex.submatch="1")
    constant(value=":")
    property(name="msg")
    constant(value="\n")
}

if $syslogtag startswith "worker-docker/sandbox." then {
    action(type="omfile" dynafile="LegacySandboxLogFileName" template="LegacySandboxLogLine" dirCreateMode="0755" fileCreateMode="0640")
    stop
}

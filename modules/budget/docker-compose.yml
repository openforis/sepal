services:
  budget:
    extends:
      file: ../docker-compose.logger.yml
      service: logger
    build:
      context: ../..
      dockerfile: ./modules/budget/Dockerfile
    image: "${DOCKER_REGISTRY_HOST:-localhost}/openforis/budget:${SEPAL_VERSION:-latest}"
    container_name: budget
    init: true
    environment:
      DEPLOY_ENVIRONMENT: "${DEPLOY_ENVIRONMENT}"
      TZ: "UTC"
      MYSQL_HOST: "mysql"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      HTTP_PORT: "80"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      USER_URL: "${USER_URL:-http://user/}"
      SEPAL_USER: "sepalAdmin"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      start_period: 60s
      start_interval: 1s
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - sepal
    restart: always
    ulimits:
      core: 0
    platform: linux/amd64

networks:
  sepal:
    external: true

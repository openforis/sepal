services:
  sandbox:
    build:
      context: ../..
      dockerfile: ./modules/sandbox/Dockerfile
      ulimits:
        nofile:
          soft: 65536
          hard: 65536
      network: host
    image: "${DOCKER_REGISTRY_HOST:-localhost}/openforis/sandbox:${SEPAL_VERSION:-latest}"
    platform: linux/amd64 # Required for macOS builds

# The shared Data bucket and the role user credentials are issued for. user-data runs with the environment's
# regular AWS keys; the role trusts the IAM user these keys belong to.
- name: Provision user data storage
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: "{{ lookup('env', 'AWS_REGION') }}"
    environment_name: "{{ lookup('env', 'DEPLOY_ENVIRONMENT') | lower }}"
    identity: "sepal-{{ environment_name }}-user-data"
    bucket: "{{ identity }}"

  tasks:
    - name: Look up the account
      amazon.aws.aws_caller_info:
      register: caller

    - name: Refuse an empty environment or credentials that cannot assume roles
      ansible.builtin.assert:
        that:
          - environment_name | length > 0
          - "':user/' in caller.arn"
        fail_msg: >-
          DEPLOY_ENVIRONMENT must be set, and provisioning must run with an IAM user's keys; root credentials
          cannot assume roles.

    - name: Create the user data bucket
      amazon.aws.s3_bucket:
        name: "{{ bucket }}"
        region: "{{ region }}"
        state: present
        encryption: AES256
        object_ownership: BucketOwnerEnforced
        public_access:
          block_public_acls: true
          ignore_public_acls: true
          block_public_policy: true
          restrict_public_buckets: true
        policy: "{{ lookup('template', 'user-data/bucket-policy.json.j2') }}"

    - name: Abort incomplete multipart uploads after 7 days
      community.aws.s3_lifecycle:
        name: "{{ bucket }}"
        region: "{{ region }}"
        rule_id: abort-incomplete-multipart-uploads
        prefix: ""
        abort_incomplete_multipart_upload_days: 7
        status: enabled
        state: present

    - name: Create the role user credentials are issued for
      amazon.aws.iam_role:
        name: "{{ identity }}"
        assume_role_policy_document: "{{ lookup('template', 'user-data/role-trust-policy.json.j2') }}"
        create_instance_profile: false
        state: present

    - name: Limit the role to the prefix of the user named in the session tag
      amazon.aws.iam_policy:
        iam_type: role
        iam_name: "{{ identity }}"
        policy_name: user-prefix
        policy_json: "{{ lookup('template', 'user-data/role-policy.json.j2') }}"
        state: present

    - name: Show the bucket and role
      ansible.builtin.debug:
        msg:
          - "Bucket: {{ bucket }}"
          - "Role: arn:aws:iam::{{ caller.account }}:role/{{ identity }}"

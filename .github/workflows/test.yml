name: Test

on:
  pull_request:
  push:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  # A push run tests only what changed since the previous push, so cancelling one would leave those
  # changes untested. A pull request run always covers the whole pull request.
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      tests: ${{steps.select.outputs.tests}}
      lint: ${{steps.select.outputs.lint}}
      python: ${{steps.select.outputs.python}}
      deploy: ${{steps.select.outputs.deploy}}
      shell: ${{steps.select.outputs.shell}}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: python3 -m unittest discover -s .github/scripts -p '*_test.py'
      - id: select
        run: python3 .github/scripts/select_jobs.py
        env:
          EVENT: ${{github.event_name}}
          BEFORE: ${{github.event.before}}

  test:
    name: ${{matrix.module}}
    needs: changes
    if: needs.changes.outputs.tests != '[]'
    runs-on: ubuntu-latest
    # The *.integration.test.js suites reach a real Postgres, since the schema, collation and
    # transaction guarantees they cover cannot be shown against a fake. Entries without such a suite
    # do not ask for it.
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: sepal
      POSTGRES_PASSWORD: sepal
      POSTGRES_ROOT_PASSWORD: sepal-root
    strategy:
      fail-fast: false
      matrix:
        # The entries live in .github/scripts/select_jobs.py, which keeps those the change affects.
        include: ${{fromJSON(needs.changes.outputs.tests)}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            ${{matrix.lock || format('{0}/package-lock.json', matrix.module)}}
            ${{matrix.module}}/lib/*/package-lock.json
      - name: Install system packages
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{matrix.packages}}
      - name: Use the lock of a consuming module
        if: matrix.lock
        run: cp "${{matrix.lock}}" "${{matrix.module}}/package-lock.json"
      # With the module's own lock of each library, as its image installs it
      - name: Install shared libraries
        if: matrix.libs
        run: |
          for lib in ${{matrix.libs}}; do
            cp "${{matrix.module}}/lib/$(basename "$lib")/package-lock.json" "$lib/"
            (cd "$lib" && npm install --no-audit --no-fund)
          done
      - run: npm ci
        working-directory: ${{matrix.module}}
      # SEPAL's own image, for its locale and extensions
      - name: Start Postgres
        if: matrix.postgres
        run: |
          docker build -t sepal-postgres -f modules/postgres/Dockerfile .
          docker run -d --name postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD="$POSTGRES_ROOT_PASSWORD" -e SEPAL_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_INITDB_ARGS="--locale-provider=builtin --builtin-locale=C.UTF-8" \
            sepal-postgres
          for i in $(seq 60); do
            docker exec postgres pg_isready -h 127.0.0.1 -U postgres && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1
      # vitest single-shots rather than watching because Actions sets CI
      - run: npm test
        working-directory: ${{matrix.module}}

  lint:
    name: modules/gui lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: modules/gui/package-lock.json
      - run: npm ci
        working-directory: modules/gui
      - run: npm run lint
        working-directory: modules/gui

  python:
    name: time-series stacker
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y python3-gdal
      - run: /usr/bin/python3 -m unittest discover -s lib/python/shared -p 'test_*.py' -v

  deploy:
    name: deploy scripts
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s hosting-services/aws/sepal/test -p '*_test.py' -v

  shell:
    name: shell
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck zstd
      # New code is held to warnings; update-app.sh only to errors, because it carries
      # pre-existing warnings in code this change does not touch.
      - run: shellcheck -S warning modules/app-manager/sepal-app-kernel modules/app-manager/test/*.sh
      - run: shellcheck -S error modules/app-manager/update-app.sh
      - run: shellcheck -S warning modules/ops/script/sepal-build.sh modules/ops/test/*.sh
      - run: bash modules/ops/test/sepal-build.test.sh
      - run: python3 -m unittest discover -s modules/ops/test -p '*_test.py'
      - run: python3 -m unittest discover -s ci/test -p '*_test.py'
      - run: modules/app-manager/test/run-all.sh

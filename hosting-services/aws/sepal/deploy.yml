- name: Configure Sepal instance
  hosts: all
  user: ec2-user
  become: yes
  gather_facts: true
  gather_subset:
    - network

  # bin/deploy verifies the images of the modules it finds as "module: <name>"
  vars:
    modules:
      - {module: logger}
      - {module: backup}
      - {module: rabbitmq}
      - {module: email}
      - {module: mysql}
      - {module: mysql-backup}
      - {module: gee}
      - {module: user}
      - {module: budget}
      - {module: app-manager}
      - {module: worker}
      - {module: message}
      - {module: recipe}
      - {module: scene-metadata}
      - {module: user-assets}
      - {module: user-files}
      - {module: gui}
      - {module: ceo-gateway}
      - {module: ssh-gateway}
      - {module: terminal}
      - {module: gateway}
      - {module: caddy}

  pre_tasks:
    - set_fact:
        sepal_ip: "{{ ec2_private_ip_address }}"
        sepal_ssh_ip: "{{ hostvars[inventory_hostname].ansible_eth0.ipv4_secondaries[0].address }}"
        syslog_address: "udp://{{ ec2_private_ip_address }}"

    # syslog address
    - name: Write syslog_address to /tmp/syslog-address
      copy:
        dest: /tmp/syslog-address
        content: "{{ syslog_address }}"
      delegate_to: localhost

    # bash prompt
    - name: Set bash prompt
      blockinfile:
        path: /etc/profile
        block: |
          # Bash prompt
          PS1='{{ lookup('env', 'BASH_PROMPT') }}'

    # set locale
    - name: Set locale
      lineinfile:
        path: /etc/environment
        line: "{{ item }}"
      with_items:
        - "LANG=en_US.utf-8"
        - "LC_ALL=en_US.utf-8"

    # increase max_map_count to prevent out of memory errors
    # enable overcommit so Redis background saves cannot fail on fork
    - name: Configure kernel VM settings
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: yes
      with_items:
        - {name: vm.max_map_count, value: 1048576}
        - {name: vm.overcommit_memory, value: 1}

    # One transaction: each yum task reloads the repository metadata
    - name: Install packages
      yum:
        name:
          - monit
          - multitail
          - htop
          - "@Development Tools"

    - name: Stop monit
      systemd:
        name: monit
        state: stopped
        enabled: yes
        masked: no

    - name: Configure monit/1
      copy:
        src: "monit/sepal/monit.d/"
        dest: "/etc/monit.d/"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: Configure monit/2
      template:
        src: "monit/config.template"
        dest: "/etc/monit.d/config"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: Configure monit/3
      copy:
        src: "monit/sepal/check/"
        dest: "/usr/local/bin/"
        owner: "root"
        group: "root"
        mode: "0755"

    - name: Configure monit/4
      template:
        src: "monit/pushover-notify.template"
        dest: "/usr/local/bin/pushover-notify"
        owner: "root"
        group: "root"
        mode: "0755"

    - file: path="/data/sepal/etc" state=directory
    - template: src="./aws.properties" dest=/data/sepal/etc/aws.properties

    # sshd
    - name: Bind sshd to primary private IP
      lineinfile:
        path: /etc/ssh/sshd_config
        line: "ListenAddress {{ ec2_private_ip_address }}"
        insertafter: "#ListenAddress"
      register: sshd_config

    - name: Restart sshd
      service:
        name: sshd
        state: restarted
      when: sshd_config.changed

    # # rsyslog
    - name: Copy rsyslog.conf
      template: src="rsyslog.conf" dest=/etc/rsyslog.conf

    # profile.d
    - name: Copy profile.d
      copy:
        src: "profile.d/"
        dest: "/etc/profile.d/"
        owner: "root"
        group: "root"
        mode: "0644"

    # docker
    - file: path="/data/docker/storage/devicemapper/metadata" state=directory
    - file: path="/data/docker/storage/tmp" state=directory

    - name: Create docker-registry certificate dir
      file:
        path: "/etc/docker/certs.d/{{ lookup('env', 'DOCKER_REGISTRY_HOST') }}"
        state: directory

    - name: Create docker log dir
      file:
        path: "/var/log/docker/containers"
        state: directory

    - name: Copy docker-registry certificate
      copy:
        src: "{{ config_home }}/certificates/docker-registry.crt"
        dest: "/etc/docker/certs.d/{{ lookup('env', 'DOCKER_REGISTRY_HOST') }}/ca.crt"

    - name: Enable the Docker extras topic
      command: "amazon-linux-extras enable docker"
      changed_when: false

    # Only a DOCKER_VERSION change upgrades Docker (see deploy.sh)
    - name: Install docker
      yum:
        name: "docker{{ '-' ~ lookup('env', 'DOCKER_VERSION') if lookup('env', 'DOCKER_VERSION') else '' }}"

    - name: Create /etc/docker
      file:
        path: "/etc/docker"
        state: directory

    - name: Copy /etc/docker/daemon.json
      template: src=docker/main-daemon.json dest=/etc/docker/daemon.json
#
    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
#
    - name: Enable docker
      systemd:
        name: docker
        state: started
        enabled: yes
        masked: no

    - name: pip install Docker SDK
      pip:
        name:
          - urllib3==1.26.18
          - requests
          - docker
        executable: pip3

    - name: Init a new swarm with default parameters
      docker_swarm:
        advertise_addr: "{{ sepal_ip }}"
      register: swarm_init

    - debug:
        msg: "swarm worker join token: {{ swarm_init.swarm_facts.JoinTokens.Worker }}"

    - name: Wait for swarm leader
      command: docker node ls
      register: node
      retries: 15
      delay: 2
      until: node.stdout is search("Leader")      

    - name: Write token to /tmp/swarm-token
      copy:
        dest: /tmp/swarm-token
        content: "{{ swarm_init.swarm_facts.JoinTokens.Worker }}"
      delegate_to: localhost

    - docker_network:
        name: sepal
        driver: overlay
        attachable: yes
        ipam_config:
          - subnet: 172.20.0.0/16
            iprange: 172.20.0.0/24

    - name: Wait for overlay ready
      command: docker network inspect sepal --format '{{ "{{" }} .Containers {{ "}}" }}'
      register: network
      retries: 15
      delay: 2
      until: network.stdout != "null"            

    - file:
        path: "/usr/local/lib/docker/cli-plugins"
        state: directory

    - uri:
        url: https://github.com/docker/compose/releases/download/v{{ lookup('env', 'DOCKER_COMPOSE_VERSION') }}/docker-compose-linux-x86_64
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: +x
        status_code: [200, 304]

    - uri:
        url: https://github.com/docker/buildx/releases/download/v{{ lookup('env', 'DOCKER_BUILDX_VERSION') }}/buildx-v{{ lookup('env', 'DOCKER_BUILDX_VERSION') }}.linux-amd64
        dest: /usr/libexec/docker/cli-plugins/docker-buildx
        mode: +x
        status_code: [200, 304]

    - file: path="/etc/sepal/env.d" state=directory
    - name: Copy env file to env-config
      copy:
        src: "{{ env_file }}"
        dest: "/etc/sepal/env.d/env-config"

    - name: Creating env-current file
      copy:
        dest: "/etc/sepal/env.d/env-current"
        content: |
          SEPAL_VERSION={{ version }}
          WORKER_AMI_VERSION={{ worker_ami_version }}
          SEPAL_IP={{ sepal_ip }}
          SEPAL_SSH_IP={{ sepal_ssh_ip }}
          SYSLOG_ADDRESS={{ syslog_address }}

    - name: Assemble a single env file
      ansible.builtin.assemble:
        src: /etc/sepal/env.d
        dest: /etc/sepal/env

    - name: Copy logger docker compose file
      copy:
        src: "{{ lookup('env', 'PROJECT_DIR') }}/modules/docker-compose.logger.yml"
        dest: "/var/lib/sepal/modules/"

  tasks:
    - import_role: {name: live-patching}
    - import_role: {name: aws-mount-efs}
    - import_role: {name: docker-login}

    # Pulling all images up front, before any container is recreated, keeps running modules untouched
    # when a pull fails and leaves each module's downtime to the recreate itself
    - name: Pull module images
      shell: >
        printf '%s\n' {{ modules | map(attribute='module') | join(' ') }}
        | xargs -P 0 -I MODULE docker pull --quiet
        {{ lookup('env', 'DOCKER_REGISTRY_HOST') }}/openforis/MODULE:{{ version }}
      changed_when: false

    - name: Run modules
      include_role:
        name: run-module
      vars:
        module: "{{ entry.module }}"
      loop: "{{ modules }}"
      loop_control:
        loop_var: entry
        label: "{{ entry.module }}"

  post_tasks:
    - name: Start monit
      systemd:
        name: monit
        state: started
        enabled: yes
        masked: no

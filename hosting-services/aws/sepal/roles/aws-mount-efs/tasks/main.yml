---
- name: Mount EFS Sepal Home Dir
  mount:
    name: "/data/sepal/home"
    fstype: "efs"
    state: "mounted"
    src: "{{ lookup('env', 'AWS_EFS_ID') }}:/data/sepal/home"
    opts: "defaults,_netdev"
    dump: 0
    passno: 0

- name: Install restricted homes mount setup
  copy:
    src: sepal-restricted-home.sh
    dest: /usr/local/bin/sepal-restricted-home
    owner: root
    group: root
    mode: '0755'

- name: Install restricted homes mount service
  copy:
    src: sepal-restricted-home.service
    dest: /etc/systemd/system/sepal-restricted-home.service
    owner: root
    group: root
    mode: '0644'

- name: Prepare restricted homes mount
  systemd:
    name: sepal-restricted-home
    daemon_reload: yes
    enabled: yes
    state: started

- name: Apply and verify restricted homes mount
  command: /usr/local/bin/sepal-restricted-home
  changed_when: false

# Logs stay on the local /var/log volume. These unmount the former EFS log mounts from existing hosts; the running
# logger keeps its own copy of the mounts until the deploy recreates it.
- name: Unmount EFS user logs
  mount:
    name: "/var/log/sepal/user"
    state: "absent"

- name: Unmount EFS worker instance logs
  mount:
    name: "/var/log/sepal/worker"
    state: "absent"

- name: Mount /data/sepal/jupyter
  mount:
    name: "/data/sepal/jupyter"
    fstype: "lustre"
    state: "mounted"
    src: "{{ lookup('env', 'AWS_FSX_ID') }}/data/sepal/jupyter"
    opts: "noatime,flock"
    dump: 0
    passno: 0

- name: Mount /data/sepal/shared
  mount:
    name: "/data/sepal/shared"
    fstype: "lustre"
    state: "mounted"
    src: "{{ lookup('env', 'AWS_FSX_ID') }}/data/sepal/shared"
    opts: "noatime,flock"
    dump: 0
    passno: 0

- name: Mount /data/sepal/shiny
  mount:
    name: "/data/sepal/shiny"
    fstype: "lustre"
    state: "mounted"
    src: "{{ lookup('env', 'AWS_FSX_ID') }}/data/sepal/shiny"
    opts: "noatime,flock"
    dump: 0
    passno: 0

services:
  scene-redis:
    extends:
      file: ../docker-compose.logger.yml
      service: logger
    image: "redis:6"
    container_name: scene-redis
    # Holds the per-collection import watermarks: losing one silently re-imports an entire scene
    # collection.
    # maxmemory is a guard rail, not a cache budget: with noeviction, reaching it makes writes fail.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - "${SEPAL_DATA_DIR}/scene-redis:/data"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      start_period: 60s
      start_interval: 1s
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - sepal
    restart: unless-stopped

  scene:
    extends:
      file: ../docker-compose.logger.yml
      service: logger
    build:
      context: ../..
      dockerfile: ./modules/scene/Dockerfile
      ulimits:
        nofile:
          soft: 65536
          hard: 65536
    image: "${DOCKER_REGISTRY_HOST:-localhost}/openforis/scene:${SEPAL_VERSION:-latest}"
    container_name: scene
    init: true
    volumes:
      - "${SEPAL_DATA_DIR}/scene/csv:/var/lib/scene/csv"
    environment:
      TZ: "UTC"
      DEPLOY_ENVIRONMENT: "${DEPLOY_ENVIRONMENT}"
      REDIS_HOST: "scene-redis"
      CSV_DIR: "/var/lib/scene/csv"
      POSTGRES_HOST: "postgres"
      POSTGRES_USER: "sepal"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      UPDATE_INTERVAL_MINUTES: 60
      MIN_HOURS_PUBLISHED: 24
      HTTP_PORT: "80"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
      NICFI_PLANET_API_KEY: "${NICFI_PLANET_API_KEY}"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      start_period: 60s
      start_interval: 1s
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - sepal
    restart: unless-stopped
    ulimits:
      core: 0

networks:
  sepal:
    external: true

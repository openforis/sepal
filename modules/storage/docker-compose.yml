services:
  storage-redis:
    extends:
      file: ../docker-compose.logger.yml
      service: logger
    image: "redis:6"
    container_name: storage-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      # Keeps the pre-rename directory name so existing deployments carry their data over.
      - "${SEPAL_DATA_DIR}/user-storage-redis:/data"
      - "${SEPAL_PROJECT_DIR}/modules/storage/redis.conf:/usr/local/etc/redis/redis.conf:ro"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      start_period: 60s
      start_interval: 1s
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - sepal
    restart: always

  storage:
    extends:
      file: ../docker-compose.logger.yml
      service: logger
    build:
      context: ../..
      dockerfile: ./modules/storage/Dockerfile
      ulimits:
        nofile:
          soft: 65536
          hard: 65536
    image: "${DOCKER_REGISTRY_HOST:-localhost}/openforis/storage:${SEPAL_VERSION:-latest}"
    container_name: storage
    init: true
    volumes:
      - "${SEPAL_DATA_DIR}/sepal/home:/sepalUsers"
    environment:
      DEPLOY_ENVIRONMENT: "${DEPLOY_ENVIRONMENT}"
      SEPAL_ADMIN_USERNAME: "sepaladmin"
      SEPAL_ADMIN_PASSWORD: "${SEPAL_ADMIN_PASSWORD}"
      GATEWAY_HOST: "gateway"
      RABBITMQ_HOST: "rabbitmq"
      MYSQL_HOST: "mysql"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      REDIS_HOST: "storage-redis"
      HOME_DIR: "/sepalUsers"
      SCAN_MIN_DELAY_SECONDS: "300"
      SCAN_MAX_DELAY_SECONDS: "86400"
      SCAN_DELAY_INCREASE_FACTOR: "2"
      SCAN_CONCURRENCY: "5"
      SCAN_MAX_RETRIES: "10"
      SCAN_INITIAL_RETRY_DELAY_SECONDS: "30"
      INACTIVITY_TIMEOUT_DAYS: "365"
      INACTIVITY_NOTIFICATION_DELAY_DAYS: "7"
      INACTIVITY_GRACE_PERIOD_DAYS: "30"
      INACTIVITY_MAX_SPREAD_HOURS: "1"
      INACTIVITY_CONCURRENCY: "1"
      INACTIVITY_MAX_RETRIES: "100"
      INACTIVITY_INITIAL_RETRY_DELAY_SECONDS: "60"
      INACTIVITY_USER_STORAGE_THRESHOLD_MB: "1"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      start_period: 60s
      start_interval: 1s
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - sepal
    restart: always
    ulimits:
      core: 0
    platform: linux/amd64 # Required for macOS builds

networks:
  sepal:
    external: true

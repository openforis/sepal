# Redis configuration for scene-metadata-redis.
#
# Holds the per-collection import watermarks -- a handful of keys. Losing one
# silently re-imports an entire scene collection, so eviction is unacceptable.
#
# maxmemory is a guard rail, not a cache budget: with noeviction, reaching it
# makes writes fail loudly rather than silently discarding keys.
maxmemory 64mb
maxmemory-policy noeviction

[Unit]
After=network.target docker.socket data-sepal-home.mount data-sepal-jupyter.mount data-sepal-shared.mount data-sepal-shiny.mount

[Service]
# The Docker API on port 2375 is unauthenticated. The Sandbox security group admits only the main host, but it
# cannot filter a sandbox reaching its own host over its bridge.
ExecStartPre=/usr/sbin/iptables -I INPUT -i docker0 -p tcp --dport 2375 -j DROP
ExecStartPre=/usr/sbin/iptables -I INPUT -i br-+ -p tcp --dport 2375 -j DROP
ExecStart=
ExecStart=/usr/bin/dockerd

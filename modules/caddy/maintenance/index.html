<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex">
    <!-- Reloading picks up SEPAL again as soon as maintenance mode is switched off -->
    <meta http-equiv="refresh" content="60">
    <link rel="icon" type="image/png" sizes="32x32" href="/_maintenance/favicon-32x32.png">
    <title>S E P A L - Maintenance</title>

    <script>
        (function () {
            var preference = 'dark'
            try {
                var stored = localStorage.getItem('sepal:theme')
                if (stored === 'light' || stored === 'system') preference = stored
            } catch (e) {}
            var theme = preference === 'system'
                ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
                : preference
            document.documentElement.setAttribute('data-theme', theme)
        })()
    </script>

    <style>
        :root {
            --background-color: #111215;
            --text-color: #fff;
            --secondary-text-color: #c7cacc;
            --veil-color: rgba(1, 1, 1, 0.65);
            --accent-color: #c5b397;
        }

        html[data-theme=light] {
            --background-color: hsl(38, 16%, 91%);
            --text-color: hsl(40, 12%, 10%);
            --secondary-text-color: hsl(40, 6%, 26%);
            --veil-color: hsla(40, 22%, 95%, .58);
            --accent-color: hsl(25, 28%, 36%);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-weight: 300;
            letter-spacing: .5px;
            -webkit-font-smoothing: antialiased;
        }

        .slideshow {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        .slideshow img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation-iteration-count: infinite;
        }

        .slideshow .image1 {
            animation: slideshow1 14s linear infinite;
        }

        .slideshow .image2 {
            opacity: 0;
            animation: slideshow2 14s linear infinite;
        }

        .slideshow .veil {
            position: absolute;
            inset: 0;
            background-color: var(--veil-color);
        }

        @keyframes slideshow1 {
            0% { transform: scale(1.25) rotate(0deg); }
            60% { transform: scale(1.1) rotate(-3deg); }
            80% { transform: scale(1.30) rotate(1deg); }
            100% { transform: scale(1.25) rotate(0deg); }
        }

        @keyframes slideshow2 {
            0% { opacity: 0; transform: scale(1.1) rotate(0deg); }
            40% { opacity: 0; transform: scale(1.1) rotate(0deg); }
            60% { opacity: 1; transform: scale(1.15) rotate(1deg); }
            80% { opacity: 1; transform: scale(1.20) rotate(2deg); }
            100% { opacity: 0; transform: scale(1.25) rotate(3deg); }
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 50rem;
            padding: 25vh 5% 2rem;
        }

        .title {
            font-family: "Source Sans Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 3.5rem;
            font-weight: 300;
            line-height: 3.5rem;
            letter-spacing: .3rem;
            text-transform: uppercase;
            animation: title 1000ms ease-in-out both;
        }

        .title hr {
            width: 4rem;
            height: 1px;
            margin: 1rem 0 0 0;
            border: none;
            background-color: var(--text-color);
        }

        .tagline {
            font-family: Merriweather, Georgia, "Times New Roman", Times, serif;
            font-style: italic;
            font-size: 1rem;
            line-height: 1.5rem;
            color: var(--secondary-text-color);
            animation: tagline 500ms 250ms ease-in-out both;
        }

        .notice {
            animation: notice 500ms 500ms ease-in-out both;
        }

        .notice h1 {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin: 0 0 .5rem;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--accent-color);
        }

        .notice h1::before {
            content: '';
            width: .6rem;
            height: .6rem;
            border-radius: 50%;
            background-color: var(--accent-color);
            animation: pulse 2000ms ease-out infinite;
        }

        .notice p {
            margin: 0;
            font-size: 1.1rem;
            line-height: 1.8rem;
        }

        @keyframes title {
            0% { opacity: 0; transform: translateX(100%); }
        }

        @keyframes tagline {
            0% { opacity: 0; transform: translateY(-100%); }
        }

        @keyframes notice {
            0% { opacity: 0; transform: translateY(50%); }
        }

        @keyframes pulse {
            0%, 10% { opacity: 1; }
            100% { opacity: .3; }
        }

        @media (max-width: 600px) {
            main {
                padding-top: 15vh;
            }

            .title {
                font-size: 3rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before {
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="slideshow">
        <img class="image1" src="/_maintenance/background1.jpg" alt="">
        <img class="image2" src="/_maintenance/background2.jpg" alt="">
        <div class="veil"></div>
    </div>
    <main>
        <div class="title">
            SEPAL
            <hr>
        </div>
        <div class="tagline">
            System for earth observations, data access, processing &amp; analysis for land monitoring.
        </div>
        <div class="notice">
            <h1>Under maintenance</h1>
            <p>SEPAL is currently undergoing maintenance and will be back soon.</p>
            <p>This page refreshes automatically once SEPAL is available again.</p>
        </div>
    </main>
</body>

</html>

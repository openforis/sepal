services:
  message:
    extends:
      file: ../docker-compose.logger.yml
      service: logger
    build:
      context: ../..
      dockerfile: ./modules/message/Dockerfile
    image: "${DOCKER_REGISTRY_HOST:-localhost}/openforis/message:${SEPAL_VERSION:-latest}"
    container_name: message
    init: true
    environment:
      DEPLOY_ENVIRONMENT: "${DEPLOY_ENVIRONMENT}"
      MYSQL_HOST: "mysql"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      HTTP_PORT: "80"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      start_period: 60s
      start_interval: 1s
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - sepal
    restart: always
    ulimits:
      core: 0
    platform: linux/amd64

networks:
  sepal:
    external: true

services:
  worker:
    extends:
      file: ../docker-compose.logger.override.yml
      service: logger
    volumes:  # To allow dynamic reloading in dev
      # lib/shared
      - ${SEPAL_PROJECT_DIR}/lib/js/shared/src:/usr/local/src/sepal/lib/js/shared/src
      - ${SEPAL_PROJECT_DIR}/lib/js/shared/package.json:/usr/local/src/sepal/lib/js/shared/package.json
      - ${SEPAL_PROJECT_DIR}/modules/worker/lib/shared/package-lock.json:/usr/local/src/sepal/lib/js/shared/package-lock.json
      - ${SEPAL_PROJECT_DIR}/modules/worker/lib/shared/node_modules:/usr/local/src/sepal/lib/js/shared/node_modules
      # module
      - ${SEPAL_PROJECT_DIR}/modules/worker:/usr/local/src/sepal/modules/worker
    # Host path of the project sources, used by workerTypes.js to add task-container hot-reload
    # mounts. Dev-only: prod has no project checkout on the host (same pattern as app-launcher).
    environment:
      SEPAL_HOST_PROJECT_DIR: "${SEPAL_PROJECT_DIR}"
      # Local instances are reached via per-instance network aliases (no host-published
      # ports), so task-executor traffic hits the CONTAINER port (80), not the AWS-style
      # published 8080.
      WORKER_PORT: "80"
    # Resolve host.docker.internal to the Docker host so the local hosting provider can reach the
    # docker-api socat proxy (:2375) and the locally-provisioned sandbox containers. Dev-only —
    # with HOSTING_SERVICE=aws the worker uses each instance's own Docker daemon (real EC2 IPs).
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # docker-api — exposes the host Docker socket over TCP :2375 for the local (dev) hosting provider.
  # Relocated from sepal-server's dev override as part of its decommission. Dev-only: it is NOT in the
  # base compose, so prod (HOSTING_SERVICE=aws) never exposes the Docker socket, matching sepal-server.
  socat:
    build:
      context: .
      dockerfile: Dockerfile.socat
    container_name: docker-api
    command: TCP4-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${SEPAL_IP}:2375:2375"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2375"]
      start_period: 60s
      start_interval: 1s
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - sepal

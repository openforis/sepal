# Redis configuration for gateway-redis.
#
# Holds sessions and the authoritative user records. Evicting a key logs
# users out or breaks authentication, so eviction is never acceptable here.
#
# maxmemory is a guard rail, not a cache budget: with noeviction, reaching it
# makes writes fail loudly rather than silently discarding keys.
maxmemory 256mb
maxmemory-policy noeviction

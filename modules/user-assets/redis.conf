# Redis configuration for user-assets-redis.
#
# Holds cached Earth Engine asset trees. These are rebuildable by the poll, but
# evicting mid-scan leaves the asset manager reconciling a partial tree.
#
# maxmemory is a guard rail, not a cache budget: with noeviction, reaching it
# makes writes fail loudly rather than silently discarding keys.
maxmemory 1gb
maxmemory-policy noeviction

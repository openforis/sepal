name: Test

on:
  pull_request:
  push:
    branches: [sepal-server, master]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: ${{matrix.module}}
    runs-on: ubuntu-latest
    # The *.integration.test.js suites reach a real Postgres, since the schema, collation and
    # transaction guarantees they cover cannot be shown against a fake. Modules without such a
    # suite ignore it.
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: sepal
      POSTGRES_PASSWORD: sepal
      POSTGRES_ROOT_PASSWORD: sepal-root
    strategy:
      fail-fast: false
      matrix:
        include:
          # The library carries no lock of its own, so it is tested with the one most modules install it
          # from. Its gdal wrapper shells out to the GDAL tools.
          - module: lib/js/shared
            lock: modules/worker/lib/shared/package-lock.json
            packages: gdal-bin python3-gdal
          - module: modules/gui
          - module: modules/gee
            libs: lib/js/shared lib/js/ee
          - module: modules/task
            libs: lib/js/shared
          - module: modules/task-manager
            libs: lib/js/shared
          - module: modules/app-manager
            libs: lib/js/shared
          - module: modules/budget
            libs: lib/js/shared
          - module: modules/email
            libs: lib/js/shared
          - module: modules/gateway
            libs: lib/js/shared
          - module: modules/message
            libs: lib/js/shared
          - module: modules/r-proxy
            libs: lib/js/shared
          - module: modules/recipe
            libs: lib/js/shared
          - module: modules/scene
            libs: lib/js/shared
          - module: modules/ssh-gateway
            libs: lib/js/shared
          - module: modules/storage
            libs: lib/js/shared
          - module: modules/terminal
            libs: lib/js/shared
          - module: modules/user
            libs: lib/js/shared
          - module: modules/user-assets
            libs: lib/js/shared
          - module: modules/user-files
            libs: lib/js/shared
          - module: modules/worker
            libs: lib/js/shared
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            ${{matrix.lock || format('{0}/package-lock.json', matrix.module)}}
            ${{matrix.module}}/lib/*/package-lock.json
      - name: Install system packages
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{matrix.packages}}
      - name: Use the lock of a consuming module
        if: matrix.lock
        run: cp "${{matrix.lock}}" "${{matrix.module}}/package-lock.json"
      # With the module's own lock of each library, as its image installs it
      - name: Install shared libraries
        if: matrix.libs
        run: |
          for lib in ${{matrix.libs}}; do
            cp "${{matrix.module}}/lib/$(basename "$lib")/package-lock.json" "$lib/"
            (cd "$lib" && npm install --no-audit --no-fund)
          done
      - run: npm ci
        working-directory: ${{matrix.module}}
      # Postgres is the SEPAL image, initialised as in production
      - name: Start Postgres
        run: |
          docker build -t sepal-postgres -f modules/postgres/Dockerfile .
          docker run -d --name postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD="$POSTGRES_ROOT_PASSWORD" -e SEPAL_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_INITDB_ARGS="--locale-provider=builtin --builtin-locale=C.UTF-8" \
            sepal-postgres
          for i in $(seq 60); do
            docker exec postgres pg_isready -h 127.0.0.1 -U postgres && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1
      # vitest single-shots rather than watching because Actions sets CI
      - run: npm test
        working-directory: ${{matrix.module}}
      # only gui carries its own eslint
      - run: npm run lint --if-present
        if: '!cancelled()'
        working-directory: ${{matrix.module}}

  python:
    name: time-series stacker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y python3-gdal
      - run: /usr/bin/python3 -m unittest discover -s lib/python/shared -p 'test_*.py' -v

  deploy:
    name: deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s hosting-services/aws/sepal/test -p '*_test.py' -v

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck zstd
      # New code is held to warnings; update-app.sh only to errors, because it carries
      # pre-existing warnings in code this change does not touch.
      - run: shellcheck -S warning modules/app-manager/sepal-app-kernel modules/app-manager/test/*.sh
      - run: shellcheck -S error modules/app-manager/update-app.sh
      - run: modules/app-manager/test/run-all.sh

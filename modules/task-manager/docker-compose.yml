services:
  task-manager:
    extends:
      file: ../docker-compose.logger.yml
      service: logger
    build:
      context: ../..
      dockerfile: ./modules/task-manager/Dockerfile
    image: "${DOCKER_REGISTRY_HOST:-localhost}/openforis/task-manager:${SEPAL_VERSION:-latest}"
    container_name: task-manager
    init: true
    volumes:
      # Root-equivalent access to the main host: task containers are started on its daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      - "${SEPAL_DATA_DIR}/task-manager:/var/lib/sepal/task-manager"
    environment:
      DEPLOY_ENVIRONMENT: "${DEPLOY_ENVIRONMENT}"
      MYSQL_HOST: "mysql"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      HTTP_PORT: "80"
      SEPAL_VERSION: "${SEPAL_VERSION:-latest}"
      DOCKER_REGISTRY_HOST: "${DOCKER_REGISTRY_HOST:-localhost}"
      SEPAL_HOST_DATA_DIR: "${SEPAL_DATA_DIR}"
      SYSLOG_ADDRESS: "${SYSLOG_ADDRESS:-udp://172.20.128.2}"
      TASK_MAX_CONCURRENT: "${TASK_MAX_CONCURRENT}"
      TASK_MEMORY_MB: "${TASK_MEMORY_MB}"
      TASK_MAX_CONCURRENT_LOCAL: "${TASK_MAX_CONCURRENT_LOCAL}"
      TASK_MAX_CONCURRENT_PER_USER: "${TASK_MAX_CONCURRENT_PER_USER}"
      TASK_LOCAL_MEMORY_MB: "${TASK_LOCAL_MEMORY_MB}"
      TASK_CPUS: "${TASK_CPUS}"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      start_period: 60s
      start_interval: 1s
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - sepal
    restart: always
    ulimits:
      core: 0
    platform: linux/amd64

networks:
  sepal:
    external: true

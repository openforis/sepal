# Checks the deployed main, storage and apps hosts, each by its Type tag.
- name: Kernel check, deployed hosts
  hosts: all
  user: ec2-user
  become: true
  gather_facts: false

  tasks:
    - name: Run the checks
      script: "new-host.sh {{ tags.Type }}"
      register: checks
      ignore_errors: true

    - name: Results
      debug:
        msg: "{{ checks.stdout_lines }}"

    - name: All checks pass
      assert:
        that: checks.rc == 0
        fail_msg: "{{ checks.rc }} check(s) failed on {{ tags.Type }}, see the results above"

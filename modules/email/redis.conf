# Redis configuration for email-redis.
#
# Holds the BullMQ mail queue and per-address notification preferences.
# Evicting a key drops outbound mail, so eviction is never acceptable here.
#
# maxmemory is a guard rail, not a cache budget: with noeviction, reaching it
# makes writes fail loudly rather than silently discarding keys.
maxmemory 256mb
maxmemory-policy noeviction

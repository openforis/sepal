services:
  user-data:
    extends:
      file: ../docker-compose.logger.override.yml
      service: logger
    depends_on:
      s3-emulator:
        condition: service_healthy
    environment:
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "sepal-dev"
      AWS_SECRET_ACCESS_KEY: "sepal-dev-secret"
      USER_DATA_S3_EMULATOR: "true"
      USER_DATA_S3_ENDPOINT: "http://s3-emulator:8080"
    volumes:  # To allow dynamic reloading in dev
      # lib/shared
      - ${SEPAL_PROJECT_DIR}/lib/js/shared/src:/usr/local/src/sepal/lib/js/shared/src
      - ${SEPAL_PROJECT_DIR}/lib/js/shared/package.json:/usr/local/src/sepal/lib/js/shared/package.json
      - ${SEPAL_PROJECT_DIR}/modules/user-data/lib/shared/package-lock.json:/usr/local/src/sepal/lib/js/shared/package-lock.json
      - ${SEPAL_PROJECT_DIR}/modules/user-data/lib/shared/node_modules:/usr/local/src/sepal/lib/js/shared/node_modules
      # module
      - ${SEPAL_PROJECT_DIR}/modules/user-data:/usr/local/src/sepal/modules/user-data

  # MinIO standing in for AWS S3 behind the S3 adapter, with one fixed key and the dev bucket, created at start.
  s3-emulator:
    extends:
      file: ../docker-compose.logger.override.yml
      service: logger
    image: "pgsty/minio:RELEASE.2026-06-18T00-00-00Z"
    container_name: s3-emulator
    init: true
    environment:
      MINIO_ROOT_USER: "sepal-dev"
      MINIO_ROOT_PASSWORD: "sepal-dev-secret"
      MC_HOST_local: "http://sepal-dev:sepal-dev-secret@localhost:8080"
    entrypoint:
      - /bin/sh
      - -c
      - |
        ( (until mc mb --ignore-existing local/sepal-dev-user-data > /dev/null 2>&1; do sleep 1; done) & )
        exec minio server /data --address :8080
    volumes:
      - "${SEPAL_DATA_DIR}/s3-emulator-minio:/data"
    healthcheck:
      test: ["CMD", "mc", "stat", "local/sepal-dev-user-data"]
      start_period: 30s
      start_interval: 1s
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - sepal
      - sepal-task
    restart: always

networks:
  sepal-task:
    external: true
